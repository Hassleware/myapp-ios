name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app without signing
        run: |
          xcodebuild \
            -project MyApp.xcodeproj \
            -scheme MyApp \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/MyApp.app Payload/
          zip -r MyApp.ipa Payload

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" MyApp.ipa \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatic build from commit ${{ github.sha }}"
